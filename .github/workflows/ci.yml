name: Native checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-dev protobuf-compiler libssl-dev
      - name: Architecture and provenance checks
        run: |
          python3 tools/check-architecture.py
          python3 tools/verify-upstream.py
          python3 tools/verify-ui-assets.py
          python3 tools/verify-shell-assets.py
      - name: Rust workspace checks
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
          cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Build driver agents
        run: python3 tools/build.py --all-drivers --skip-app
      - uses: actions/upload-artifact@v4
        with:
          name: driver-agents
          path: bin/drivers/
          retention-days: 7
