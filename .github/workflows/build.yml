name: Build native application packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (for example 0.1.0 or 0.1.0-rc.1)'
        default: '0.1.0'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      reuse_drivers:
        default: false
        type: boolean
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.goos }} / ${{ matrix.goarch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            msystem: CLANGARM64
            compiler: clang
            compiler_dir: clangarm64
            compiler_package: mingw-w64-clang-aarch64-clang
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      GOPROXY: 'https://proxy.golang.org|direct'
      PYTHONUTF8: '1'
      SUPERLINK_RELEASE_PUBLIC_KEY: ${{ vars.SUPERLINK_RELEASE_PUBLIC_KEY }}
      SUPERLINK_BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Configure isolated Go cache paths
        shell: bash
        run: |
          echo "GOCACHE=$RUNNER_TEMP/superlink-go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/superlink-go-mod" >> "$GITHUB_ENV"
      - name: Cache Go dependencies and native compilation
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/superlink-go-build
            ${{ runner.temp }}/superlink-go-mod
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-go1.26.3-${{ inputs.reuse_drivers && 'app' || 'full' }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-go1.26.3-${{ inputs.reuse_drivers && 'app' || 'full' }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Download signed driver base
        if: inputs.reuse_drivers
        uses: actions/download-artifact@v4
        with:
          name: driver-base
          path: driver-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native target and version
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.goos }}
          EXPECTED_ARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          python -c 'import sys; sys.path.insert(0,"tools"); from release_platforms import version_text; import os; version_text(os.environ["SUPERLINK_BUILD_VERSION"])'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev fonts-dejavu-core fonts-noto-cjk dpkg-dev
      - name: Windows CGO compiler
        id: msys2
        if: runner.os == 'Windows' && matrix.goarch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.compiler_package }}
      - name: Cache pinned Windows x64 compiler archive
        if: runner.os == 'Windows' && matrix.goarch == 'amd64'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gcc15.zip
          key: windows-gcc15-cb2fbad6162540cdf5e1facdce08d4dac359e8cf64f7f696a99274291763b815
      - name: Configure Windows compiler and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUPERLINK_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SUPERLINK_COMPILER_DIR: ${{ matrix.compiler_dir }}
          SUPERLINK_COMPILER: ${{ matrix.compiler }}
          SUPERLINK_WINDOWS_ARCH: ${{ matrix.goarch }}
        run: |
          if ($env:SUPERLINK_WINDOWS_ARCH -eq "amd64") {
            # DuckDB's prebuilt archives require libstdc++ emutls symbols removed in GCC 16.
            # Pin a standalone POSIX/SEH/UCRT GCC 15 toolchain and authenticate its bytes.
            $archive = Join-Path $env:RUNNER_TEMP "gcc15.zip"
            $destination = Join-Path $env:RUNNER_TEMP "gcc15"
            $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-14.0.0-ucrt-r7/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip"
            if (-not (Test-Path $archive)) {
              Invoke-WebRequest $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
            }
            $expected = "cb2fbad6162540cdf5e1facdce08d4dac359e8cf64f7f696a99274291763b815"
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw "Pinned GCC 15 toolchain checksum mismatch"
            }
            Expand-Archive $archive -DestinationPath $destination
            $compilerBin = Join-Path $destination "mingw64\bin"
            $compilerExe = Join-Path $compilerBin "gcc.exe"
            if ((& $compilerExe -dumpfullversion) -ne "15.2.0" -or $LASTEXITCODE -ne 0) {
              throw "Pinned GCC compiler version mismatch"
            }
            $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "CC=$compilerExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Join-Path $env:SUPERLINK_MSYS2_LOCATION "$env:SUPERLINK_COMPILER_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "CC=$env:SUPERLINK_COMPILER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test release tools and platform UI
        shell: bash
        run: |
          python -m unittest discover -s tools -p 'test_release_*.py' -v
          go test -tags ci ./internal/ui ./internal/infra/state ./internal/infra/release ./internal/infra/drivers
          go test -tags ci,gonavi_sqlite_driver ./internal/upstream/db ./cmd/driver-agent
      - name: Build application and required drivers
        shell: bash
        env:
          SUPERLINK_REUSE_DRIVERS: ${{ inputs.reuse_drivers || false }}
        run: |
          if [[ "$SUPERLINK_REUSE_DRIVERS" == 'true' ]]; then
            python tools/build.py --application-only --package --version "$SUPERLINK_BUILD_VERSION"
            python tools/driver_reuse.py --base driver-base --version "$SUPERLINK_BUILD_VERSION" --public-key "$SUPERLINK_RELEASE_PUBLIC_KEY"
          else
            python tools/build.py --all-drivers --package --version "$SUPERLINK_BUILD_VERSION"
          fi
      - name: Verify application version
        shell: bash
        run: python tools/probe_application.py --version "$SUPERLINK_BUILD_VERSION"
      - name: Create native installers
        shell: bash
        run: python tools/package_installers.py --version "$SUPERLINK_BUILD_VERSION"
      - name: Smoke test native installers
        shell: bash
        run: python tools/smoke_installers.py --version "$SUPERLINK_BUILD_VERSION"
      - name: Verify all native release products
        shell: bash
        env:
          SUPERLINK_TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: python tools/verify_release.py --version "$SUPERLINK_BUILD_VERSION" --platform "$SUPERLINK_TARGET" --public-key "$SUPERLINK_RELEASE_PUBLIC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
