name: Release SuperLink
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable version tag, e.g. v0.1.0'
        required: true
        type: string
      build_run_id:
        description: 'Optional successful native build run for the exact tagged source and version'
        default: ''
        type: string
      publish:
        description: 'Publish publicly after validation (requires configured signing keys)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      reuse_drivers: ${{ steps.drivers.outputs.reuse_drivers }}
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable version tag
        id: source
        shell: bash
        env:
          SUPERLINK_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'tools')
          from release_platforms import version_text
          tag = os.environ['SUPERLINK_TAG']
          if not tag.startswith('v'):
              raise SystemExit('release tag must start with v')
          version = version_text(tag)
          sha = subprocess.check_output(['git','rev-parse','--verify','refs/tags/'+tag+'^{commit}'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'tag={tag}\nversion={version}\nsha={sha}\n')
          PY
      - name: Verify prebuilt run provenance
        if: inputs.build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          SOURCE: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          run = os.environ['BUILD_RUN']
          if not run.isdecimal():
              raise SystemExit('native build run id must be numeric')
          data = json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}']))
          if (data['conclusion'] != 'success' or data['head_sha'] != os.environ['SOURCE']
              or data['path'] != '.github/workflows/build.yml' or data['event'] != 'workflow_dispatch'):
              raise SystemExit('native build must be successful and match the immutable tagged source')
          PYTHON
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Select verified driver reuse or full build
        id: drivers
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERLINK_RELEASE_PUBLIC_KEY: ${{ vars.SUPERLINK_RELEASE_PUBLIC_KEY }}
          SUPERLINK_VERSION: ${{ steps.source.outputs.version }}
          SUPERLINK_SOURCE: ${{ steps.source.outputs.sha }}
        run: python3 tools/prepare_release.py --version "$SUPERLINK_VERSION" --source "$SUPERLINK_SOURCE"
      - uses: actions/upload-artifact@v4
        if: steps.drivers.outputs.reuse_drivers == 'true'
        with:
          name: driver-base
          path: driver-base/
          if-no-files-found: error
          retention-days: 14
      - name: Verify driver repository publishing access
        if: steps.drivers.outputs.reuse_drivers != 'true'
        env:
          GH_TOKEN: ${{ secrets.SUPERLINK_DRIVER_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Configure SUPERLINK_DRIVER_RELEASE_TOKEN with Contents write access to ealink1/SuperLink-DriverAgents' >&2
            exit 1
          fi
          gh api repos/ealink1/SuperLink-DriverAgents --jq .full_name
  build:
    if: inputs.build_run_id == ''
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_ref: ${{ needs.prepare.outputs.sha }}
      reuse_drivers: ${{ needs.prepare.outputs.reuse_drivers == 'true' }}
  release:
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (inputs.build_run_id != '' && needs.build.result == 'skipped'))
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      SUPERLINK_TAG: ${{ needs.prepare.outputs.tag }}
      SUPERLINK_VERSION: ${{ needs.prepare.outputs.version }}
      SUPERLINK_SOURCE: ${{ needs.prepare.outputs.sha }}
      SUPERLINK_PUBLIC_KEY: ${{ vars.SUPERLINK_RELEASE_PUBLIC_KEY }}
      SUPERLINK_PRIVATE_KEY: ${{ secrets.SUPERLINK_RELEASE_PRIVATE_KEY }}
      SUPERLINK_PUBLISH: ${{ inputs.publish || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Verify complete platform matrix and signing configuration
        shell: bash
        run: |
          python tools/verify_release.py --version "$SUPERLINK_VERSION" --public-key "$SUPERLINK_PUBLIC_KEY"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          files = list(Path('dist').glob('build-info-*.json'))
          if len(files) != 6 or any(json.loads(p.read_text()).get('source') != os.environ['SUPERLINK_SOURCE'] for p in files):
              raise SystemExit('platform build source differs from immutable release source')
          PYTHON
          python - <<'PY'
          import os
          public, private = os.environ['SUPERLINK_PUBLIC_KEY'], os.environ['SUPERLINK_PRIVATE_KEY']
          if bool(public) != bool(private):
              raise SystemExit('configure both the public repository variable and private signing secret')
          if os.environ['SUPERLINK_PUBLISH'] == 'true' and not public:
              raise SystemExit('public release requires update signing keys')
          PY
      - name: Sign and verify update manifest
        if: env.SUPERLINK_PRIVATE_KEY != ''
        shell: bash
        env:
          SUPERLINK_RELEASE_PRIVATE_KEY: ${{ secrets.SUPERLINK_RELEASE_PRIVATE_KEY }}
          SUPERLINK_RELEASE_PUBLIC_KEY: ${{ vars.SUPERLINK_RELEASE_PUBLIC_KEY }}
        run: |
          channel=stable
          if [[ "$SUPERLINK_VERSION" == *-* ]]; then channel=preview; fi
          go run ./cmd/release-sign --assets-dir dist --version "$SUPERLINK_VERSION" --channel "$channel"
      - name: Render release notes and checksums
        shell: bash
        run: |
          previous=$(git describe --tags --match 'v*' --abbrev=0 "$SUPERLINK_SOURCE^" 2>/dev/null || true)
          args=()
          if [[ -n "$previous" ]]; then args+=(--previous "$previous"); fi
          python tools/release_notes.py --version "$SUPERLINK_VERSION" --revision "$SUPERLINK_SOURCE" "${args[@]}"
          python tools/verify_release.py --version "$SUPERLINK_VERSION" --checksums
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create required release drafts and verify every uploaded asset
        env:
          SUPERLINK_DRIVER_RELEASE_TOKEN: ${{ secrets.SUPERLINK_DRIVER_RELEASE_TOKEN }}
        shell: bash
        run: python tools/publish_release.py --version "$SUPERLINK_VERSION" --source "$SUPERLINK_SOURCE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-metadata
          path: |
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS.txt
            dist/manifest.json*
          if-no-files-found: warn
