[package]
name = "superlink-terminal"
version.workspace = true
edition.workspace = true
# The SSH stack requires a newer toolchain than the workspace default.
rust-version = "1.89"
license.workspace = true

[dependencies]
superlink-domain = { path = "../superlink-domain" }
thiserror = "2"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "fs", "macros"] }
portable-pty = "=0.9.0"
sysinfo = "=0.31.4"
