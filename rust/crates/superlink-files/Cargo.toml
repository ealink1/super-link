[package]
name = "superlink-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
superlink-domain = { path = "../superlink-domain" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
csv = "1"
calamine = { version = "0.26", default-features = false, features = ["dates"] }
rust_xlsxwriter = { version = "0.79", default-features = false, features = ["zlib", "constant_memory"] }
encoding_rs = "0.8"
# Pins the zip API calamine 0.26 was written against; newer zip 2.x majors
# changed ZipFile generics and no longer compile against it.
zip = "=2.2.2"

[dev-dependencies]
tempfile = "3"
