[package]
name = "superlink-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
superlink-domain = { path = "../superlink-domain" }
superlink-infra = { path = "../superlink-infra" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
base64 = "0.22"
uuid.workspace = true
chrono.workspace = true
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
fallible-iterator = "0.2"
postgres_rustls = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tokio-rustls = "0.26"
mysql = { version = "28", default-features = false, features = ["minimal", "rustls-tls", "buffer-pool"] }
ureq = "3"
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
