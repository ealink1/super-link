[workspace]
resolver = "3"
members = [
    "crates/superlink-domain",
    "crates/superlink-app",
    "crates/superlink-infra",
    "crates/superlink-ui",
    "crates/superlink-drivers",
    "crates/superlink-sql",
    "crates/superlink-files",
    "crates/superlink-update",
    "crates/superlink-terminal",
    "apps/superlink",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = "1"
anyhow = "1"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
